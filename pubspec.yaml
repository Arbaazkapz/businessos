name: businessos
description: "ShopHisab - offline-first business management app for Indian shopkeepers. Your Shop. Your Data. Always Available."
publish_to: 'none'
version: 1.5.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (classic Riverpod - no code generation required)
  flutter_riverpod: ^2.5.1

  # Local database - fully offline SQLite via Drift
  drift: ^2.32.0
  sqlite3: ^3.5.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # Formatting (currency / date, India locale)
  intl: ^0.19.0

  # Invoice PDF generation, preview, print & share
  pdf: ^3.13.0
  printing: ^5.15.0

  # Sharing arbitrary files (encrypted backup export)
  share_plus: ^12.0.2

  # Picking a file to restore from (backup import)
  file_picker: ^8.0.6

  # Security: PIN storage + biometric/face unlock
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # AES encryption for local backup files
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Unique IDs for offline-generated records (no server needed)
  uuid: ^4.4.2

  # Lightweight persisted settings (theme mode etc.) - not for secrets
  shared_preferences: ^2.3.2

  # Dashboard charts
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.5
  flutter_launcher_icons: "^0.14.4"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/

# Reads assets/icon/app_icon.png and generates every Android mipmap size,
# overwriting the default Flutter icon in place (android: true, not a
# custom name, means AndroidManifest.xml's existing icon reference never
# needs to change). Run via `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
