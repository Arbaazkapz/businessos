name: Build ShopHisab
on:
  push:
    branches: [main, master]
  workflow_dispatch:
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install Android SDK requirements
        shell: bash
        run: |
          SDK_MANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDK_MANAGER" ]; then
            SDK_MANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDK_MANAGER" ]; then
            echo "Android SDK command-line tools are required on this runner."
            exit 1
          fi
          "$SDK_MANAGER" "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Prepare Android
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.businessos --project-name businessos .
          fi
          python3 tool/configure_android.py
      - name: Resolve dependencies and generate database
        run: |
          flutter pub get
          dart run build_runner build
          dart run flutter_launcher_icons
      - name: Analyze (errors and warnings stop the build)
        run: flutter analyze --no-fatal-infos
      - name: Regression tests
        run: flutter test
      - name: Build installable test APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/ShopHisab.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ShopHisab-APK
          path: build/ShopHisab.apk
          retention-days: 14
      # Play Store bundles need YOUR private release key. Never publish the
      # committed debug key. See docs/BUILD_AND_RELEASE.md for release signing.
